
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lists Practice</title>
</head>
<body>
    <h1>HTML Lists Practice</h1>

    <section>
        <h2>Unordered List</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>
    </section>

    <section>
        <h2>Ordered List</h2>
        <ol>
            <li>Understand the requirement</li>
            <li>Write the HTML code</li>
            <li>Test the result</li>
        </ol>
    </section>

    <section>
        <h2>Nested List</h2>
        <ul>
            <li>Frontend Development
                <ul>
                    <li>HTML</li>
                    <li>CSS</li>
                </ul>
            </li>
            <li>Backend Development
                <ul>
                    <li>C#</li>
                    <li>SQL</li>
                </ul>
            </li>
        </ul>
    </section>
</body>
</html>
